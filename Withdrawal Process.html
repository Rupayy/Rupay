<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Withdrawal Process</title>
<style>
:root{--g:#26bd00;--g2:#1a9a00;--bg:#f3f8fb;--card:#fff;--field:#f6f6f6;--tx:#161d26;--mut:#8a94a0;--err:#e5383b;--warn:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1417;--card:#182025;--field:#222c32;--tx:#eef2f5;--mut:#7f8b95}}
:root[data-theme="dark"]{--bg:#0f1417;--card:#182025;--field:#222c32;--tx:#eef2f5;--mut:#7f8b95}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,#2bc500,#1fa800);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 22px;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(38,189,0,.25)}
header h1{font-size:18px;font-weight:600;margin:0}
header button{background:none;border:0;color:#fff;padding:4px;display:flex;cursor:pointer}
main{max-width:480px;margin:-8px auto 0;padding:20px 16px 40px}
.card{background:var(--card);border-radius:24px;padding:22px 20px;box-shadow:0 10px 30px rgba(20,40,60,.08)}
label{display:block;font-weight:600;font-size:15px;margin:18px 0 8px}
label:first-child{margin-top:0}
.f{width:100%;border:1.5px solid transparent;background:var(--field);color:var(--tx);border-radius:14px;padding:16px;font-size:16px;font-family:inherit;outline:none;transition:.2s;appearance:none;-webkit-appearance:none}
.f::placeholder{color:var(--mut);opacity:.7}
.f:focus{border-color:var(--g);background:var(--card);box-shadow:0 0 0 4px rgba(38,189,0,.12)}
.f.bad{border-color:var(--err)}
.sel{position:relative}
.sel svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
select.f:invalid{color:var(--mut)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.chip{background:var(--field);border:0;border-radius:12px;padding:12px 0;font-size:15px;color:var(--tx);cursor:pointer;font-family:inherit;transition:.2s}
.chip:active,.chip.on{background:var(--g);color:#fff}
.btn{width:100%;margin-top:26px;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2bc500,#1a9a00);box-shadow:0 8px 20px rgba(38,189,0,.35);cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:30px 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.ic.e{background:rgba(229,56,59,.12);color:var(--err)}
.ic.w{background:rgba(245,158,11,.14);color:var(--warn)}
.sheet h2{margin:0 0 8px;font-size:20px}
.sheet p{margin:0 0 20px;color:var(--mut);line-height:1.5;font-size:15px}
.sum{background:var(--field);border-radius:14px;padding:12px 16px;text-align:left;font-size:14px;margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;gap:12px}
.sum span{color:var(--mut)}.sum b{text-align:right}
.spin{animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet .btn{margin-top:0}
</style></head>
<body>
<header>
<button aria-label="Back" onclick="history.back()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<h1>Withdrawal Process</h1>
<button aria-label="Info" onclick="document.getElementById('info').textContent='Minimum withdrawal amount is NPR 7,000.'"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01" stroke-linecap="round"/></svg></button>
</header>
<main>
<div class="card">
<label for="bank">Destination</label>
<div class="sel"><select id="bank" class="f" required>
<option value="" selected disabled>SELECT</option>
<option>eSewa</option><option>Khalti</option><option>Nabil Bank</option><option>Global IME Bank</option><option>NIC Asia Bank</option><option>Nepal Investment Mega Bank</option><option>Prabhu Bank</option><option>Sanima Bank</option><option>Siddhartha Bank</option><option>Himalayan Bank</option>
</select><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>

<label for="acc">Account Number</label>
<input id="acc" class="f" inputmode="numeric" placeholder="Receiver account number">

<label for="name">Account Holder's Name</label>
<input id="name" class="f" placeholder="Receiver's account name" autocomplete="name">

<label for="amt">Amount (NPR)</label>
<input id="amt" class="f" inputmode="numeric" placeholder="Amount to withdraw">
<div class="chips"><button class="chip" data-v="1000">1000</button><button class="chip" data-v="3000">3000</button><button class="chip" data-v="5000">5000</button><button class="chip" data-v="10000">10000</button></div>
<div class="note" id="info">Minimum withdrawal amount is NPR 7,000.</div>

<label for="rem">Purpose/Remarks</label>
<input id="rem" class="f" placeholder="Write purpose/remarks..">

<button class="btn" id="go">Submit</button>
</div>
</main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const amt=$('amt');
amt.addEventListener('input',()=>{amt.value=amt.value.replace(/\D/g,'');sync()});
function sync(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===amt.value))}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{amt.value=c.dataset.v;sync();amt.classList.remove('bad')});
$('acc').addEventListener('input',e=>e.target.value=e.target.value.replace(/[^\dA-Za-z]/g,''));
function show(html){$('sheet').innerHTML=html;$('ov').classList.add('show')}
function close_(){$('ov').classList.remove('show')}
window.close_=close_;
$('go').onclick=()=>{
 let ok=true;
 [['bank',$('bank').value],['acc',$('acc').value.trim()],['name',$('name').value.trim()],['amt',amt.value]].forEach(([id,v])=>{const el=$(id);el.classList.toggle('bad',!v);if(!v)ok=false});
 if(!ok){window.scrollTo({top:0,behavior:'smooth'});return}
 const n=parseInt(amt.value,10);
 if(n<7000){
  show(`<div class="ic e"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div><h2>Not Eligible</h2><p>You are not eligible for this payment. You need at least NPR 7,000 for withdrawal.</p><button class="btn" onclick="close_()">Try Again</button>`);
 }else{
  show(`<div class="ic w"><svg class="spin" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg></div><h2>Waiting for Confirmation</h2><p>Your withdrawal request has been submitted and is awaiting confirmation.</p><div class="sum"><div><span>To</span><b>${esc($('bank').value)}</b></div><div><span>Account</span><b>${esc($('acc').value)}</b></div><div><span>Name</span><b>${esc($('name').value)}</b></div><div><span>Amount</span><b>NPR ${n.toLocaleString('en-IN')}</b></div></div><button class="btn" onclick="close_()">Done</button>`);
 }
};
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.querySelectorAll('.f').forEach(e=>e.addEventListener('input',()=>e.classList.remove('bad')));
$('bank').addEventListener('change',e=>e.target.classList.remove('bad'));
$('ov').onclick=e=>{if(e.target.id==='ov')close_()};
</script>
</body></html>
