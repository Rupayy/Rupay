<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdraw funds</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--tx:#f4f6fb;--mu:#8e98b2;--gold:#e8c27a}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:48px 20px;position:relative;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:.35;z-index:0;animation:float 14s ease-in-out infinite alternate}
.o1{width:420px;height:420px;background:#60bb46;top:-120px;left:-100px}
.o2{width:420px;height:420px;background:#5d2e91;bottom:-140px;right:-100px;animation-delay:-5s}
.o3{width:300px;height:300px;background:#1a56db;top:40%;left:55%;animation-delay:-9s;opacity:.25}
@keyframes float{to{transform:translate(50px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
.balance{background:linear-gradient(135deg,#1b2238,#0e1322);border:1px solid var(--line);border-radius:24px;padding:28px;margin-bottom:36px;position:relative;overflow:hidden;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.balance::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(232,194,122,.16) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 3.2s .6s ease-in-out 1}
@keyframes sheen{to{transform:translateX(100%)}}
.balance small{color:var(--mu);font-size:13px}
.balance h2{font-size:40px;font-weight:800;margin:6px 0 14px;letter-spacing:-1px}
.balance h2 span{color:var(--gold);font-size:20px;font-weight:600;margin-right:6px}
.chip{display:inline-block;font-size:12px;color:var(--gold);border:1px solid rgba(232,194,122,.35);padding:5px 12px;border-radius:99px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:14px;margin:6px 0 22px}
.list{display:grid;gap:14px}
.m{--c:#fff;display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;backdrop-filter:blur(14px);transition:transform .3s,border-color .3s,box-shadow .3s,background .3s;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.m:nth-child(1){animation-delay:.25s}.m:nth-child(2){animation-delay:.4s}.m:nth-child(3){animation-delay:.55s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.m:hover,.m:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 18px 40px -18px var(--c);outline:none;background:rgba(255,255,255,.08)}
.m.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 18px 50px -16px var(--c);background:rgba(255,255,255,.09)}
.logo{width:60px;height:60px;border-radius:16px;flex:none;display:grid;place-items:center;transition:transform .4s}
.m:hover .logo{transform:scale(1.08) rotate(-4deg)}
.logo svg{width:60px;height:60px;display:block}
.info{flex:1}.info b{display:block;font-size:17px;font-weight:700}
.info span{font-size:13px;color:var(--mu)}
.tag{font-size:11px;color:var(--mu);margin-top:6px;display:block}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.3s}
.m.sel .radio{border-color:var(--c);background:var(--c)}
.radio svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:.4s .1s}
.m.sel .radio svg{stroke-dashoffset:0}
.go{margin-top:26px;width:100%;border:0;border-radius:18px;padding:18px;font:inherit;font-weight:700;font-size:16px;color:#1a1305;background:linear-gradient(135deg,#f3d493,#e8c27a 50%,#c9964a);cursor:pointer;transition:.3s;opacity:.4;pointer-events:none}
.go.on{opacity:1;pointer-events:auto;box-shadow:0 14px 34px -12px rgba(232,194,122,.7)}
.go.on:hover{transform:translateY(-2px)}
.sec{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:20px;color:var(--mu);font-size:12px}
.sec svg{width:14px;height:14px;stroke:var(--mu);fill:none;stroke-width:2}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.m{opacity:1}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main class="wrap">
  
  <h1>Withdraw funds</h1>
  <p class="sub">Choose where you want to receive your money.</p>

  <div class="list" role="radiogroup" aria-label="Withdrawal method">
    <button class="m" role="radio" aria-checked="false" data-m="esewa" style="--c:#60bb46">
      <span class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#60bb46"/><circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="4"/><path d="M21 33h22c0-6-4.5-10-11-10s-11 4-11 10 4.500 10 11 10c4 0 7-1.500 9-4" fill="none" stroke="#fff" stroke-width="4.500" stroke-linecap="round"/></svg></span>
      <span class="info"><b>eSewa</b><span>Instant to your eSewa wallet</span><i class="tag">Fee: Free · Arrives in seconds</i></span>
      <span class="radio"><svg viewBox="0 0 14 14"><path d="M2 7l3.500 3.500L12 3.500"/></svg></span>
    </button>

    <button class="m" role="radio" aria-checked="false" data-m="khalti" style="--c:#7b3fe4">
      <span class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#5d2e91"/><path d="M22 15v34M22 33l18-18M26.500 31l15 18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="18" r="4" fill="#e8c27a"/></svg></span>
      <span class="info"><b>Khalti</b><span>Instant to your Khalti wallet</span><i class="tag">Fee: Free · Arrives in seconds</i></span>
      <span class="radio"><svg viewBox="0 0 14 14"><path d="M2 7l3.500 3.500L12 3.500"/></svg></span>
    </button>

    <button class="m" role="radio" aria-checked="false" data-m="bank" style="--c:#3b82f6">
      <span class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bg)"/><path d="M32 13L12 24h40z" fill="#fff"/><g fill="#fff"><rect x="16" y="28" width="6" height="16" rx="1"/><rect x="29" y="28" width="6" height="16" rx="1"/><rect x="42" y="28" width="6" height="16" rx="1"/><rect x="12" y="47" width="40" height="5" rx="1.500"/></g></svg></span>
      <span class="info"><b>Bank transfer</b><span>Any Nepali bank account</span><i class="tag">Fee: NPR 10 · 1 business day</i></span>
      <span class="radio"><svg viewBox="0 0 14 14"><path d="M2 7l3.500 3.500L12 3.500"/></svg></span>
    </button>
  </div>

  <button class="go" id="go">Continue to payment</button>
  <p class="sec"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Encrypted and protected end to end</p>
</main>
<script>
var sel=null,btns=document.querySelectorAll('.m'),go=document.getElementById('go');
btns.forEach(function(b){b.onclick=function(){
  btns.forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});
  b.classList.add('sel');b.setAttribute('aria-checked','true');
  sel=b.dataset.m;go.classList.add('on');
  go.textContent='Continue with '+b.querySelector('b').textContent;
}});
go.onclick=function(){if(sel)location.href='pay.html?method='+sel};
</script>
</body>
</html>
