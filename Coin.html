<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy Coins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#0f1b2d; --mute:#5d6b7e; --line:#e2e6ec;
  --brand:#1746d1; --brand-d:#0f34a3; --soft:#eaf0ff;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px}
.logo b{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.secure{font-size:14px;color:var(--mute)}
main{max-width:1040px;margin:0 auto;padding:48px 24px 72px;display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
h1{font-size:clamp(28px,4vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);margin:10px 0 28px;max-width:520px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:#fafbfd}
.ico{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.info{flex:1}
.amt{font-size:20px;font-weight:600;letter-spacing:-.01em}
.note{font-size:13px;color:var(--mute)}
.badge{font-size:12px;font-weight:600;color:var(--brand);background:var(--soft);padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:2px}
.btn{border:0;cursor:pointer;background:var(--brand);color:#fff;font:600 14px 'Instrument Sans';padding:11px 22px;border-radius:9px;transition:background .15s}
.btn:hover{background:var(--brand-d)}
.btn:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;position:sticky;top:24px}
aside h2{font-size:16px;font-weight:600;margin-bottom:14px}
aside li{list-style:none;display:flex;gap:10px;padding:9px 0;font-size:14px;color:var(--mute);border-top:1px solid var(--line)}
aside li:first-of-type{border-top:0}
aside li::before{content:"✓";color:var(--brand);font-weight:700}
aside p{margin-top:16px;font-size:13px;color:var(--mute)}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static;order:2}}
@media(max-width:480px){.row{padding:14px;gap:12px}.btn{padding:10px 16px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><b>A</b>Aurum</div>
  <div class="secure">🔒 Secure checkout</div>
</div></header>

<main>
  <section>
    <h1>Buy coins</h1>
    <p class="sub">Select a coin pack. You'll confirm your order and pay on the next page.</p>
    <div class="list" id="list"></div>
  </section>
  <aside>
    <h2>What you get</h2>
    <ul>
      <li>Coins added right after payment</li>
      <li>Encrypted, secure payment</li>
      <li>Support available every day</li>
    </ul>
    <p>Questions about an order? Contact support from your account page.</p>
  </aside>
</main>

<script>
const packs=[500,800,1000,1500,2000,5000,10000,15000];
const list=document.getElementById('list');
packs.forEach(n=>{
  const r=document.createElement('div');
  r.className='row';
  r.innerHTML='<div class="ico">C</div><div class="info"><div class="amt">'+n.toLocaleString()+' Coins'+
    (n===2000?'<span class="badge">Popular</span>':'')+'</div><div class="note">Coin pack</div></div>'+
    '<button class="btn" type="button" aria-label="Buy '+n+' coins">Buy now</button>';
  r.querySelector('button').addEventListener('click',()=>{location.href='pay.html?coins='+n});
  list.appendChild(r);
});
</script>
</body>
</html>
